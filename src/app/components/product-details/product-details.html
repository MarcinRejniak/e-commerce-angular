<div class="product-details">
  <div class="product-details__container">

    <div class="product-details__image-section">
      <div class="image-box">
        <img [ngSrc]="product()?.imageUrl!"
             width="400"
             height="450"
             (error)="$any($event.target).src = 'assets/images/products/placeholder.png'"
             class="image-box__img"
             alt="{{ product()?.name }}">
      </div>
    </div>

    <div class="product-details__info-section">
      <nav class="breadcrumb">
        <span class="breadcrumb__category">{{ product()?.category?.categoryName }}</span>
      </nav>

      <h1 class="product-details__title">{{ product()?.name }}</h1>

      <p class="product-details__description">
        {{ product()?.description }}
      </p>

      <div class="product-details__price">
        {{ product()?.unitPrice | currency: 'USD' }}
      </div>

      <div class="product-details__actions">
        <button (click)="addToCart()" class="btn-add-large">
          <i class="bi bi-cart-plus"></i> Add to Cart
        </button>

        <a routerLink="/products" class="btn-back">
          <i class="bi bi-arrow-left"></i> Back to Shop
        </a>
      </div>
    </div>

  </div>
</div>
