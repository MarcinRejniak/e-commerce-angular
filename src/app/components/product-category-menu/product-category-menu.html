<div class="category-menu">
  <span class="sidebar-title">Categories</span>

  <nav class="category-menu__nav" aria-label="Categories navigation">
    @for (productCategory of productCategories(); track productCategory.id) {
      <a [routerLink]="['/category', productCategory.id, productCategory.categoryName]"
         routerLinkActive="active"
         class="category-link">
        {{ productCategory.categoryName }}
      </a>
    }
  </nav>
</div>
