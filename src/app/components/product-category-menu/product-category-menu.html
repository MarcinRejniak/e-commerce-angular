<div class="card border-0 shadow-sm p-3 rounded-4">
  <h6 class="fw-bold mb-3 px-3 text-uppercase small tracking-wider">Categories</h6>
  <nav aria-label="Categories navigation">
    @for (productCategory of productCategories(); track productCategory.id) {
      <a routerLink="/category/{{ productCategory.id }}/{{ productCategory.categoryName }}"
         routerLinkActive="active"
         class="category-link">
        {{ productCategory.categoryName }}</a>
    }
  </nav>
</div>
