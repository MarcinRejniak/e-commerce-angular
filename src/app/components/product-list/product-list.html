<div class="row g-4">
  @for (product of products(); track product.sku) {
    <div class="col-xl-3 col-lg-4 col-md-6 col-sm-12">

      <div class="card product-card shadow-sm h-100">
        <div class="product-img-wrapper">
          <img [src]="product.imageUrl"
               (error)="$any($event.target).src = 'images/products/placeholder.png'"
               class="img-fluid rounded-3"
               style="max-height: 180px; object-fit: contain;"
               alt="Product">
        </div>

        <div class="card-body p-4 d-flex flex-column">
          <div class="text-muted small mb-1">{{ currentCategoryName }}</div>

          <h5 class="product-title text-dark">{{ product.name }}</h5>

          <div class="d-flex justify-content-between align-items-center mt-auto pt-3">
            <span class="price-tag">{{ product.unitPrice | currency: 'USD' }}</span>

            <button class="btn btn-primary btn-cart d-flex align-items-center px-3">
              <i class="bi bi-plus-lg me-1"></i>Add
            </button>
          </div>
        </div>

      </div>
    </div>
  }
</div>
