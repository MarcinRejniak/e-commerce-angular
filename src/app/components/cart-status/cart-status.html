<div class="cart-status-wrapper">
  <a routerLink="/cart-details" class="cart-icon-container">
    <i class="fa fa-shopping-cart fs-4 text-secondary"></i>
    <span class="badge rounded-pill bg-danger">
      {{ this.cartService.totalQuantity() }}
    </span>
  </a>

  <div class="cart-total text-dark">
    {{ this.cartService.totalPrice() | currency:'USD'}}
  </div>
</div>
