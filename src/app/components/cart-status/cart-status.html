<div class="cart-status" routerLink="/cart-details">
  <div class="cart-status__icon-wrapper">
    <i class="fa fa-shopping-cart cart-status__icon"></i>
    <span class="cart-status__badge">
      {{ cartService.totalQuantity() }}
    </span>
  </div>

  <div class="cart-status__info">
    <span class="cart-status__amount">
      {{ cartService.totalPrice() | currency:'USD' }}
    </span>
  </div>
</div>
